# selbstlite – nginx-Konfiguration für den Host (Ubuntu, Netcup-Rootserver)
#
# Installation:
#   sudo cp infra/nginx/selbstlite.conf /etc/nginx/sites-available/selbstlite.conf
#   Domains unten anpassen (app./portal./sign.<domain>.de), dann:
#   sudo ln -s /etc/nginx/sites-available/selbstlite.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d app.example.de -d portal.example.de -d sign.example.de
#   sudo nginx -t && sudo systemctl reload nginx
#
# Ziel-Ports (nur 127.0.0.1, siehe .env): Frontend 8310, Backend 8311, Documenso 8312.
# Wichtig: X-Forwarded-For wird mit $remote_addr ÜBERSCHRIEBEN (nicht angehängt) – das Backend nutzt die IP
# für Login-Sperren und Protokolle; ein vom Client mitgeschickter Header darf nicht durchgereicht werden.

upstream selbstlite_frontend  { server 127.0.0.1:8310; keepalive 16; }
upstream selbstlite_backend   { server 127.0.0.1:8311; keepalive 16; }
upstream selbstlite_documenso { server 127.0.0.1:8312; keepalive 8; }

# Anfragebegrenzung für Anmelde- und Portal-Endpunkte (zusätzlich zur Sperre im Backend)
limit_req_zone $binary_remote_addr zone=selbstlite_auth:10m rate=10r/m;

map $http_upgrade $selbstlite_connection { default upgrade; '' ''; }

# ───────────── HTTP → HTTPS ─────────────
server {
    listen 80;
    listen [::]:80;
    server_name app.example.de portal.example.de sign.example.de;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# ───────────── Interne App (Geschäftsführer) ─────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.de;

    ssl_certificate     /etc/letsencrypt/live/app.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include /etc/nginx/snippets/selbstlite-headers.conf;
    client_max_body_size 25m;   # Belege, Kontoauszüge, Logos

    location /api/auth/ {
        limit_req zone=selbstlite_auth burst=10 nodelay;
        include /etc/nginx/snippets/selbstlite-proxy.conf;
        proxy_pass http://selbstlite_backend;
    }
    location /api/ {
        include /etc/nginx/snippets/selbstlite-proxy.conf;
        proxy_read_timeout 300s;   # GoBD-Export, KI-Kontierung, DATEV-Export
        proxy_pass http://selbstlite_backend;
    }
    location / {
        include /etc/nginx/snippets/selbstlite-proxy.conf;
        proxy_pass http://selbstlite_frontend;
    }
}

# ───────────── Kundenportal: nur Portal-, Kündigungs- und öffentliche Endpunkte ─────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portal.example.de;

    ssl_certificate     /etc/letsencrypt/live/app.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    include /etc/nginx/snippets/selbstlite-headers.conf;
    client_max_body_size 10m;

    location = / { return 302 /portal; }
    location ~ ^/api/(portal/login|public/terminations) {
        limit_req zone=selbstlite_auth burst=10 nodelay;
        include /etc/nginx/snippets/selbstlite-proxy.conf;
        proxy_pass http://selbstlite_backend;
    }
    location ~ ^/api/(portal|public)/ {
        include /etc/nginx/snippets/selbstlite-proxy.conf;
        proxy_pass http://selbstlite_backend;
    }
    location ~ ^/(portal|kuendigen)(/|$) {
        include /etc/nginx/snippets/selbstlite-proxy.conf;
        proxy_pass http://selbstlite_frontend;
    }
    location /_next/ {
        include /etc/nginx/snippets/selbstlite-proxy.conf;
        proxy_pass http://selbstlite_frontend;
    }
    location = /favicon.ico { proxy_pass http://selbstlite_frontend; }
    # Alles andere (interne App, interne API) ist über die Portal-Domain nicht erreichbar
    location / { return 302 /portal; }
}

# ───────────── Signatur (Documenso) ─────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name sign.example.de;

    ssl_certificate     /etc/letsencrypt/live/app.example.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25m;

    location / {
        include /etc/nginx/snippets/selbstlite-proxy.conf;
        proxy_pass http://selbstlite_documenso;
    }
}
